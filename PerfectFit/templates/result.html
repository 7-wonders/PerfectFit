{% extends "index.html" %}

{% include 'components/header.html' %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/result.css') }}">
{% endblock %}

{% block content %}
<div class="container">
    <!-- 제목 및 수정 버튼 -->
    <div class="title-section">
        <div class="title-wrapper">
            <span id="display-title">2024-10-11 웹개발자 분야 모의면접</span>
            <button id="edit-button" class="edit-icon">✏️</button>
        </div>
    </div>

    <!-- 내용 섹션 -->
    <div class="content-section">
        <!-- 질문 및 답변 박스 -->
        <form id="questions-form" class="left-panel">
            <!-- 질문과 답변은 JavaScript로 동적 생성 -->
        </form>

        <!-- 가운데 화살표 -->
        <div class="arrow-panel">
            <span class="arrow">→</span>
        </div>

        <!-- 개선 사항 박스 -->
        <div class="right-panel">
            <div class="result-header">개선 사항</div>
            <div class="result-content">개선 사항은 여기에 표시됩니다.</div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/result.js') }}"></script>
{% endblock %}
