{% extends "index.html" %}

{% block styles  %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/text.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/resume_loading.css') }}" />
{% endblock %}

{% block scripts %}
     <script>
        task_id = "{{ task_id }}";
        setInterval(() => {
            fetch(`/resume/task/${task_id}`, { method: "POSt" })
                .then(response => {
                    if (response.status === 200) {
                        window.location.href = `/resume/write?task_id=${task_id}`;
                    } else if (response.status === 202) {
                        console.log("Running...")
                    } else {
                        console.error("Error")
                    }
                });
        }, 1000);
    </script>
{% endblock %}

{% block content %}
    <div class="container">
        <img src="{{ url_for('static', filename='img/resume_loading.gif') }}" />
        <p class = "Medium-28-light loading-text">AI가 자기소개서를 작성하고 있습니다...</p>
    </div>
{% endblock %}
