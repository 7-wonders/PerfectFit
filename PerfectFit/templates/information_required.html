{% extends "index.html" %}

{% include 'components/header.html' %}
{% include 'components/footer.html' %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/information_required.css') }}" />
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/information_required.js') }}"></script>
{% endblock %}

{% block content %}
    <form class="uk-form-stacked uk-center" id="informationForm">
        <div class="container">

            <div class="uk-margin">
                <article class="uk-article">
                    <h1 class="uk-article-title"><a class="uk-link-reset" href="">필수 정보</a></h1>
                    <p class="uk-article-meta">원하는 서비스를 위해 정보를 입력해주세요.</p>
                </article>
            </div>

            <div class="uk-margin">
                <label class="uk-form-label" for="name">이름</label>
                <div class="uk-form-controls">
                    <input class="uk-input" id="name" type="text" placeholder="이름을 입력해주세요.">
                </div>
            </div>

            <div class="uk-margin">
                <label class="uk-form-label" for="age">나이</label>
                <div class="uk-form-controls">
                    <input class="uk-input" id="age" type="text">
                </div>
            </div>

            <div class="uk-margin">
                <div class="uk-flex uk-flex-between">
                    <label class="uk-form-label" for="email">이메일</label>
                    <button class="uk-button uk-button-default uk-button-small">이메일 인증하기</button>
                </div>

                <div class="uk-form-controls">
                    <div class="uk-flex uk-flex-between">
                        <input class="uk-input" id="email" type="text">
                        <select class="uk-select" aria-label="Select" id="emailDomain">
                            <option>@naver.com</option>
                            <option>@gmail.com</option>
                            <option>@daum.net</option>
                            <option>@nate.com</option>
                            <option>@kakao.com</option>
                            <option>@me.com</option>
                            <option>@yahoo.com</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="uk-margin">
                <div class="uk-form-controls">
                    <input class="uk-input" id="verificationCode" type="text" placeholder="이메일 인증코드 입력">
                </div>
            </div>

            <div class="uk-margin">
                <label class="uk-form-label" for="address">주소</label>
                <div class="uk-form-controls">
                    <input class="uk-input" id="address" type="text" placeholder="주소 입력">
                </div>
            </div>

            <div class="uk-margin">
                <div class="uk-form-controls">
                    <input class="uk-input" id="detailedAddress" type="text" placeholder="상세 주소">
                </div>
            </div>
        </div>

        <div class="uk-flex uk-flex-between">
            <button class="uk-button uk-button-default">이전</button>
            <button class="uk-button uk-button-default" id="nextButton" type="button" disabled>다음</button>
        </div>
    </form>
{% endblock %}
