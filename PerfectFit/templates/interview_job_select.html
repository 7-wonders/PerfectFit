{% extends "index.html" %}

{% include 'components/header.html' %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/text.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/interview_job_select.css') }}">
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/interview_job_select.js') }}"></script>
{% endblock %}

{% block content %}
    <div class="container">
        <!-- 제목 입력란 -->
        <label for="title" class="title-label">제목</label>
        <input type="text" id="title" placeholder="제목을 입력해주세요." class="title-input" />

        <!-- 지원 경력 -->
        <div class="career-section">
            <span class="career-label">지원 경력</span>
            <div class="career-options">
                <label class="career-option">
                    <input type="checkbox" id="career-experienced" />
                    경력
                </label>
                <label class="career-option">
                    <input type="checkbox" id="career-newbie" />
                    신입
                </label>
            </div>
        </div>

        <!-- 직군 선택 -->
        <div class="job-category-section">
            <!-- 직군 데이터가 동적으로 추가될 공간 -->
        </div>

        <!-- 버튼 영역 -->
        <div class="button-container">
            <button class="prev-button">이전</button>
            <button class="next-button">다음</button>
        </div>
    </div>
{% endblock %}
