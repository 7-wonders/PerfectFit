{% extends "index.html" %}


{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/not_found.css') }}">
{% endblock %}

{% block content %}
    <div class="not-found">
        <img src="{{ url_for('static', filename='img/error.svg') }}" alt="not found" />
        {% if error %}
            <h4>{{ error.exception.message }}</h4>
        {% endif %}
    </div>
{% endblock %}
