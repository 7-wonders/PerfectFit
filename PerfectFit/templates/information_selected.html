{% extends "index.html" %}

{% include 'components/header.html' %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/information_selected.css') }}" />
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/information_selected.js') }}"></script>
{% endblock %}

{% block content %}
    <div class="container">
        <form class="uk-form-stacked uk-center" action="/user/optional" method="post">
            <div class="uk-margin">
                <article class="uk-article">
                    <h1 class="uk-article-title"><a class="uk-link-reset" href="">선택 정보</a></h1>
                    <p class="uk-article-meta">원하는 서비스를 위해 정보를 입력해주세요.</p>
                </article>
            </div>

            <div class="uk-margin">
                <label class="uk-form-label" for="form-stacked-text">학력</label>
                <div class="uk-form-controls">
                    <div class="uk-flex uk-flex-between">
                        <input class="uk-input" id="form-stacked-text" type="text" name="university" placeholder="최종 학력을 입력해주세요." style="margin-right: 10px">
                        <select class="uk-select" name="universityStatus" aria-label="Select">
                            <option value = "재학">재학</option>
                            <option value = "휴학">휴학</option>
                            <option value = "졸업">졸업</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="uk-margin">
                <label class="uk-form-label" for="form-stacked-text">전공</label>
                <div class="uk-form-controls">
                    <input class="uk-input" name="major" id="form-stacked-text" type="text" placeholder="전공을 입력해주세요.">
                </div>
            </div>

            <div class="uk-margin">
                <label class="uk-form-label" for="form-stacked-text">학점</label>
                <div class="uk-form-controls">
                    <input class="uk-input" name="grade" id="form-stacked-text" type="text" placeholder="학점을 입력해주세요 ex) 3.8">
                </div>
            </div>

            <div class="uk-margin">
                <label class="uk-form-label" for="form-stacked-text">전화번호</label>
                <div class="uk-form-controls">
                    <input class="uk-input" id="form-stacked-text" name="phoneNumber" type="text" placeholder="전화번호를 입력해주세요.">
                </div>
            </div>

            <div class="project" id="projectExp">
                <div id = "project-wrapper-0">
                    <div class="uk-margin">
                        <div class="uk-flex uk-flex-between">
                            <label class="uk-form-label" for="form-stacked-email">프로젝트 경험</label>
                            <button type="button" class="add-btn" id = "add-project-btn" onclick="addProject()">+ 프로젝트 추가하기</button>
                        </div>

                        <div class="uk-form-controls">
                            <input class="uk-input" name="projectExperiences[0][projectName]" id="form-stacked-text" type="text" placeholder="프로젝트 이름">
                        </div>
                    </div>

                    <div class="uk-margin">
                        <label class="uk-form-label" for="form-stacked-text">프로젝트 기간</label>
                        <div class="uk-flex">
                            <div class="uk-width-1-3@s uk-flex-first">
                                <input class="uk-input" name="projectExperiences[0][fromDate]" type="date" aria-label="25">
                            </div>
                            <div class="uk-card uk-margin-left">
                                ~
                            </div>
                            <div class="uk-width-1-3@s uk-flex-last uk-margin-left">
                                <input class="uk-input" name="projectExperiences[0][toDate]" type="date" aria-label="25">
                            </div>
                        </div>
                    </div>
                    <div class = "uk-margin">
                        <input class="uk-input" name="projectExperiences[0][contents]" type="text" placeholder="프로젝트 내용1">
                    </div>
                    <div class = "add-right-btn-box">
                        <button type="button" class = "add-btn" id = "add-project-content-btn-0" onclick="addProjectContent(0)">+ 내용 추가하기</button>
                    </div>
                </div>
            </div>

            <div class="career" id="careerExp">
                <div id = "career-wrapper-0">
                    <div class="uk-margin">
                        <div class="uk-flex uk-flex-between">
                            <label class="uk-form-label" for="form-stacked-email">경력</label>
                            <button type="button" id="add-career-btn" class="add-btn" onclick="addCareer()">+ 경력 추가하기</button>
                        </div>

                        <div class="uk-form-controls">
                            <input class="uk-input" id="form-stacked-text" name="workExperiences[0][company_name]" type="text" placeholder="회사 이름">
                        </div>

                        <div class="uk-margin">
                            <label class="uk-form-label" for="form-stacked-text">경력 기간</label>
                            <div class="uk-flex">
                                <div class="uk-width-1-3@s uk-flex-first">
                                    <input class="uk-input" name="workExperiences[0][fromDate]" type="date" aria-label="25">
                                </div>
                                <div class="uk-card uk-margin-left">
                                    ~
                                </div>
                                <div class="uk-width-1-3@s uk-flex-last uk-margin-left">
                                    <input class="uk-input" name="workExperiences[0][toDate]" type="date" aria-label="25">
                                </div>
                            </div>
                        </div>

                        <div class="uk-margin">
                            <div class="uk-form-controls">
                                <input class="uk-input" name="workExperiences[0][position]" id="form-stacked-text" type="text" placeholder="직책">
                            </div>
                        </div>
                        <div class="uk-margin">
                            <div class="uk-form-controls">
                                <input class="uk-input" name="workExperiences[0][responsibility]" id="form-stacked-text" type="text" placeholder="담당 업무">
                            </div>
                        </div>
                        <div class="uk-margin">
                            <div class="uk-form-controls">
                                <input class="uk-input" name="workExperiences[0][reason]" id="form-stacked-text" type="text" placeholder="퇴사 사유">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="uk-flex uk-flex-between" style = "margin-top:30px">
                <button  type="button" id="infoButton" class="uk-button uk-button-default" onclick="backButton()">이전</button>
                <button id="completeButton" class="uk-button uk-button-primary" type="submit" >완료</button>
            </div>
        </form>
    </div>
{% endblock %}
