<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
    </head>
    <body>
        <a href="http://localhost:5000/auth/login/google?redirect_uri=http://localhost:5000/auth/test">구글 로그인</a>
        <a href="http://localhost:5000/auth/login/naver?redirect_uri=http://localhost:5000/auth/test">네이버 로그인</a>
        <a href="http://localhost:5000/auth/login/kakao?redirect_uri=http://localhost:5000/auth/test">카카오 로그인</a>
        <button onclick="handleAPI()">API</button>
        <script>
            handleAPI = () => {
                fetch('/users', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                })
                .then((response) => {
                    console.log(response);
                })
                .catch((error) => {
                    console.error('Error:', error);
                })
            }
        </script>
        <script>
            function handleSubmit() {
                fetch('/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({}),
                })
                .then((response) => {
                    console.log(response);
                })
                .catch((error) => {
                    console.error('Error:', error);
                })
            }

            function handleLogout() {
                fetch('/user/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({}),
                })
                .then((response) => {
                    console.log(response);
                })
                .catch((error) => {
                    console.error('Error:', error);
                })
            }
        </script>
        <div>
            <button onclick="handleSubmit()">재갱신</button>
            <button onclick="handleLogout()">로그아웃</button>
        </div>
    </body>
</html>
